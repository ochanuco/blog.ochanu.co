name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ochanuco/.github/.github/workflows/pnpm.yml@7b071bfac95ab5e51fc1c4eae49863449dd89524 # v1.2.0
    with:
      # コンテンツの型は管理画面で決めたスキーマ（本番の D1）から生成する。emdash-env.d.ts は git の管理外
      run: |
        pnpm exec emdash types --url https://blog.ochanu.co --output emdash-env.d.ts
        pnpm run typecheck
    secrets:
      EMDASH_TOKEN: ${{ secrets.EMDASH_TOKEN }}
